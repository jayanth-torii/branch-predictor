<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" width="1200" height="230" role="img" aria-label="For educators: one batch code on the board, the class joins, the batch maps itself">
  <defs>
    <clipPath id="eClip"><rect width="1200" height="230" rx="16"/></clipPath>
    <radialGradient id="eGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4A70FF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#4A70FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g clip-path="url(#eClip)" font-family="Segoe UI, Inter, system-ui, sans-serif">
    <rect width="1200" height="230" fill="#0B1226"/>
    <circle cx="880" cy="110" r="190" fill="url(#eGlow)"/>
    <text x="40" y="38" font-size="12" letter-spacing="2.6" fill="#6B7794">FOR EDUCATORS</text>

    <!-- The batch pass -->
    <g transform="translate(70 62)">
      <rect width="300" height="132" rx="16" fill="#141F3E" stroke="#FF6B35" stroke-opacity="0.4"/>
      <text x="22" y="32" font-size="10.5" letter-spacing="2" fill="#8A97B4">JOIN CODE</text>
      <text x="22" y="76" font-size="40" font-weight="800" fill="#FF6B35" letter-spacing="2">PTH-2027</text>

      <!-- perforation -->
      <line x1="22" y1="94" x2="278" y2="94" stroke="#2A3558" stroke-dasharray="4 6"/>
      <circle cx="0" cy="94" r="9" fill="#0B1226"/>
      <circle cx="300" cy="94" r="9" fill="#0B1226"/>

      <text x="22" y="118" font-size="12" fill="#8A97B4">no accounts &#183; no emails &#183; nothing to install</text>
    </g>

    <!-- The class assembling: chips pop in one by one -->
    <g transform="translate(400 86)" font-size="11.5" font-weight="600">
      <text y="-16" font-size="10.5" letter-spacing="2" fill="#8A97B4">JOINED</text>
      <g>
        <rect width="64" height="26" rx="13" fill="#1A2548" stroke="#2A3558"/>
        <text x="32" y="17" text-anchor="middle" fill="#C3CDE6">Aarav</text>
        <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.2s" fill="freeze"/>
      </g>
      <g transform="translate(72 0)" opacity="0">
        <rect width="58" height="26" rx="13" fill="#1A2548" stroke="#2A3558"/>
        <text x="29" y="17" text-anchor="middle" fill="#C3CDE6">Sana</text>
        <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.5s" fill="freeze"/>
      </g>
      <g transform="translate(138 0)" opacity="0">
        <rect width="58" height="26" rx="13" fill="#1A2548" stroke="#2A3558"/>
        <text x="29" y="17" text-anchor="middle" fill="#C3CDE6">Rhea</text>
        <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.8s" fill="freeze"/>
      </g>
      <g transform="translate(0 34)" opacity="0">
        <rect width="74" height="26" rx="13" fill="#1A2548" stroke="#2A3558"/>
        <text x="37" y="17" text-anchor="middle" fill="#C3CDE6">Vikram</text>
        <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.1s" fill="freeze"/>
      </g>
      <g transform="translate(82 34)" opacity="0">
        <rect width="58" height="26" rx="13" fill="#1A2548" stroke="#2A3558"/>
        <text x="29" y="17" text-anchor="middle" fill="#C3CDE6">Neha</text>
        <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.4s" fill="freeze"/>
      </g>
      <g transform="translate(148 34)" opacity="0">
        <rect width="72" height="26" rx="13" fill="#FF6B35" fill-opacity="0.18" stroke="#FF6B35" stroke-opacity="0.5"/>
        <text x="36" y="17" text-anchor="middle" fill="#FF8A5F" font-weight="800">+37</text>
        <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.7s" fill="freeze"/>
      </g>
    </g>

    <!-- The batch mapping itself: aggregate bars growing -->
    <g transform="translate(690 60)">
      <text y="0" font-size="10.5" letter-spacing="2" fill="#8A97B4">INTEREST DISTRIBUTION &#183; AGGREGATE ONLY</text>
      <g transform="translate(0 18)">
        <g>
          <text y="12" font-size="12" fill="#A3AEC7">Technology</text>
          <rect x="108" y="4" width="300" height="9" rx="4.5" fill="#FFFFFF" fill-opacity="0.08"/>
          <rect x="108" y="4" width="0" height="9" rx="4.5" fill="#FF6B35">
            <animate attributeName="width" values="0;300;300" keyTimes="0;0.5;1" dur="6s" begin="0s" repeatCount="indefinite"/>
          </rect>
          <text x="420" y="12" font-size="11.5" font-weight="700" fill="#EEF1F8">35%</text>
        </g>
        <g transform="translate(0 26)">
          <text y="12" font-size="12" fill="#A3AEC7">Analytical</text>
          <rect x="108" y="4" width="300" height="9" rx="4.5" fill="#FFFFFF" fill-opacity="0.08"/>
          <rect x="108" y="4" width="0" height="9" rx="4.5" fill="#E0567A">
            <animate attributeName="width" values="0;189;189" keyTimes="0;0.5;1" dur="6s" begin="0.15s" repeatCount="indefinite"/>
          </rect>
          <text x="420" y="12" font-size="11.5" font-weight="700" fill="#EEF1F8">22%</text>
        </g>
        <g transform="translate(0 52)">
          <text y="12" font-size="12" fill="#A3AEC7">Business</text>
          <rect x="108" y="4" width="300" height="9" rx="4.5" fill="#FFFFFF" fill-opacity="0.08"/>
          <rect x="108" y="4" width="0" height="9" rx="4.5" fill="#E0A400">
            <animate attributeName="width" values="0;137;137" keyTimes="0;0.5;1" dur="6s" begin="0.3s" repeatCount="indefinite"/>
          </rect>
          <text x="420" y="12" font-size="11.5" font-weight="700" fill="#EEF1F8">16%</text>
        </g>
        <g transform="translate(0 78)">
          <text y="12" font-size="12" fill="#A3AEC7">Creativity</text>
          <rect x="108" y="4" width="300" height="9" rx="4.5" fill="#FFFFFF" fill-opacity="0.08"/>
          <rect x="108" y="4" width="0" height="9" rx="4.5" fill="#7C6BF5">
            <animate attributeName="width" values="0;103;103" keyTimes="0;0.5;1" dur="6s" begin="0.45s" repeatCount="indefinite"/>
          </rect>
          <text x="420" y="12" font-size="11.5" font-weight="700" fill="#EEF1F8">12%</text>
        </g>
      </g>
      <text y="138" font-size="11" fill="#6B7794">Individual answers are never exposed by default.</text>
    </g>
  </g>
</svg>
