<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" width="1200" height="190" role="img" aria-label="The student journey: onboard, interest quest, stream round, matched courses">
  <defs>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF6B35" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#FF6B35" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#FF6B35" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF8A5F" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFC6AE" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FF8A5F" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="j"><rect width="1200" height="190" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#j)">
    <rect width="1200" height="190" fill="#0B1226"/>

    <!-- The rail the four stages sit on -->
    <rect x="120" y="94" width="960" height="2" fill="url(#rail)"/>
    <rect x="120" y="93" width="150" height="4" rx="2" fill="url(#pulse)">
      <animate attributeName="x" values="60; 1010; 60" dur="7s" repeatCount="indefinite"/>
    </rect>

    <!-- Four stages. Each node breathes on its own offset so the row reads as a
         sequence rather than four identical dots. -->
    <g font-family="Segoe UI, Inter, system-ui, sans-serif" text-anchor="middle">

      <g transform="translate(180 95)">
        <circle r="30" fill="#141F3E" stroke="#FF6B35" stroke-opacity="0.5" stroke-width="2">
          <animate attributeName="r" values="30;33;30" dur="4s" begin="0s" repeatCount="indefinite"/>
        </circle>
        <text y="7" font-size="22" font-weight="800" fill="#FF8A5F">01</text>
        <text y="62" font-size="15" font-weight="700" fill="#EEF1F8">Start</text>
        <text y="82" font-size="12.5" fill="#8A97B4">name · stream · marks</text>
      </g>

      <g transform="translate(480 95)">
        <circle r="30" fill="#141F3E" stroke="#FF6B35" stroke-opacity="0.5" stroke-width="2">
          <animate attributeName="r" values="30;33;30" dur="4s" begin="1s" repeatCount="indefinite"/>
        </circle>
        <text y="7" font-size="22" font-weight="800" fill="#FF8A5F">02</text>
        <text y="62" font-size="15" font-weight="700" fill="#EEF1F8">Interest quest</text>
        <text y="82" font-size="12.5" fill="#8A97B4">10 scenarios · no wrong answers</text>
      </g>

      <g transform="translate(780 95)">
        <circle r="30" fill="#141F3E" stroke="#FF6B35" stroke-opacity="0.5" stroke-width="2">
          <animate attributeName="r" values="30;33;30" dur="4s" begin="2s" repeatCount="indefinite"/>
        </circle>
        <text y="7" font-size="22" font-weight="800" fill="#FF8A5F">03</text>
        <text y="62" font-size="15" font-weight="700" fill="#EEF1F8">Stream round</text>
        <text y="82" font-size="12.5" fill="#8A97B4">15 from your own subjects</text>
      </g>

      <g transform="translate(1020 95)">
        <circle r="30" fill="#141F3E" stroke="#FF6B35" stroke-opacity="0.5" stroke-width="2">
          <animate attributeName="r" values="30;33;30" dur="4s" begin="3s" repeatCount="indefinite"/>
        </circle>
        <text y="7" font-size="22" font-weight="800" fill="#FF8A5F">04</text>
        <text y="62" font-size="15" font-weight="700" fill="#EEF1F8">Your map</text>
        <text y="82" font-size="12.5" fill="#8A97B4">ranked · explained</text>
      </g>
    </g>

    <text x="40" y="36" font-family="Segoe UI, Inter, system-ui, sans-serif"
          font-size="12" letter-spacing="2.6" fill="#6B7794">THE JOURNEY</text>
  </g>
</svg>
